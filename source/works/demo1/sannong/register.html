<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>直击三农</title>
    <link rel="stylesheet" href="css1/index.css">
    <link rel="stylesheet" href="css/all.css">
    <link rel="stylesheet" href="css1/register.css">
</head>
<body>
    <!-- 顶部开始 -->
    <header>
        <div class="login-right">
            <a href="login.html" class="login-link">登录</a>
            <a href="register.html" class="register-link">注册</a>
        </div>
        <img src="images/xlBanner.png" alt="农业科技有限公司">
    </header>
    <nav>
        <ul>
            <li><a href="index.html">网站首页</a></li>
            <li><a href="zhiji.html">直击三农</a></li>
            <li><a href="#">行业知识</a></li>
            <li><a href="#">联系我们</a></li>
            <li><a href="#">农业技术</a></li>
        </ul>
    </nav>
    <!-- 主体 -->
    <main>
        <div class="register-container">
            <div class="register">
                <!-- 左侧注册区 -->
                <div class="left-register">
                    <div class="tabs">
                        <span class="tab-item on" data-target="phone-register-form">手机注册</span>
                        <span class="tab-item" data-target="email-register-form">邮箱注册</span>
                    </div>
                    
                    <!-- 手机注册表单 -->
                    <form id="phone-register-form" class="show">
                        <ul>
                            <li><i class="sj"></i><input type="text" placeholder="请输入手机号"></li>
                            <li><i class="yzm"></i><input type="text" placeholder="验证码"><button type="button">换一张</button></li>
                            <li><i class="pwd"></i><input type="password" placeholder="请输入密码"></li>
                            <li><i class="pwd"></i><input type="password" placeholder="请确认密码"></li>
                            <li><input type="submit" value="立即注册"></li>
                        </ul>
                    </form>

                    <!-- 邮箱注册表单 -->
                    <form id="email-register-form">
                        <ul>
                            <li><i class="user"></i><input type="text" placeholder="请输入邮箱地址"></li>
                            <li><i class="yzm"></i><input type="text" placeholder="验证码"><button type="button">换一张</button></li>
                            <li><i class="pwd"></i><input type="password" placeholder="请输入密码"></li>
                            <li><i class="pwd"></i><input type="password" placeholder="请确认密码"></li>
                            <li><input type="submit" value="立即注册"></li>
                        </ul>
                    </form>
                </div>

                <!-- 右侧区域 -->
                <div class="right-section">
                    <p>已有账号，<a href="login.html">立即登录</a></p>
                    <div class="other">
                        <h3>使用其他方式注册</h3>
                        <i class="qq"></i>
                        <i class="wx"></i>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer class="footer">
        <ul>
            <li><a href="#">&copy; 2023 农业科技有限公司. 保留所有权利.</a></li>
            <li><a href="#">隐私政策</a></li>
            <li><a href="#">使用条款</a></li>
            <li><a href="#">网站地图</a></li>
        </ul>
    </footer>
    <script src="js/register.js">
        
    </script>
</body>
</html>
