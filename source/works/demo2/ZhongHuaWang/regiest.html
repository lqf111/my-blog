    <div class="registration-container" >
        <h2>注册</h2>
        <form id="registrationForm">
            <div class="form-group">
                <label for="phone">手机号码：</label>
                <input type="text" id="phone" name="phone" placeholder="请输入有效的11位手机号码" required>
            </div>
            <div class="form-group">
                <label for="password">密码：</label>
                <input type="password" id="password" name="password" placeholder="密码由数字、字母、特殊符号组成，区分字母大小写，长度在8-20位" required>
            </div>
            <div class="form-group">
                <label for="confirmPassword">确认密码：</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="请再输入一次密码" required>
            </div>
            <div class="form-group captcha-group">
                <label for="captcha">验证码：</label>
                <div class="captcha-container">
                    <span id="captchaText">8n637</span>
                    <button type="button" id="changeCaptcha">看不清楚点击更换</button>
                </div>
                <input type="text" id="userCaptcha" name="userCaptcha" placeholder="请填写图片验证码" required>
            </div>
            <div class="form-group sms-captcha-group">
                <label for="smsCaptcha">短信验证码：</label>
                <input type="text" id="smsCaptcha" name="smsCaptcha" placeholder="请输入短信验证码" disabled>
                <button type="button" id="getSmsCaptcha">获取手机验证码</button>
                <!-- <div class="checkbox-container">
                    <label for="agree"><input type="checkbox" id="agree" name="agree" required>我已看过并同意《中华网用户协议》</label>
                    
                    
                </div> -->
                
            </div>
            <!-- <div class="checkbox">
                <input type="checkbox" id="remember-me">
                <label for="remember-me">记住我</label>
            </div> -->
            
            <button type="submit">立即注册</button>
        </form>
